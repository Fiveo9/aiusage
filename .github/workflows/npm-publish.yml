name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0). Leave empty to use current package.json version.'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package versions
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/set-release-version.mjs

      - name: Build
        run: pnpm build

      - name: Publish CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@fiveo9/aiusage@${VERSION}" version >/dev/null 2>&1; then
            echo "@fiveo9/aiusage@${VERSION} already exists; skipping."
          else
            pnpm publish --filter @fiveo9/aiusage --no-git-checks --access public
          fi

      - name: Publish Widget to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/widget/package.json').version")
          if npm view "@fiveo9/aiusage-widget@${VERSION}" version >/dev/null 2>&1; then
            echo "@fiveo9/aiusage-widget@${VERSION} already exists; skipping."
          else
            pnpm publish --filter @fiveo9/aiusage-widget --no-git-checks --access public
          fi
